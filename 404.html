<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Idir Meradji</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7B2CBF;--accent-deep:#4A1178;--accent-soft:#EDE3F8;
  --bg:#FAFAFB;--surface:#FFFFFF;--line:#E7E4EC;--ink:#14121A;--muted:#6B6478;
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
  background:var(--bg);color:var(--ink);font-family:var(--body);text-align:center;
}
body::before{
  content:"";position:fixed;inset:-30% -10% auto -10%;height:560px;z-index:0;
  background:radial-gradient(45% 50% at 50% 30%, color-mix(in srgb,var(--accent) 20%,transparent) 0%, transparent 70%);
  filter:blur(14px);pointer-events:none;
}
.box{position:relative;z-index:1;max-width:560px}
.code{
  font-family:var(--display);font-weight:700;letter-spacing:-.05em;
  font-size:clamp(4.5rem,17vw,8.5rem);line-height:.9;margin:0 0 6px;color:var(--accent);
}
h1{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);letter-spacing:-.02em;margin:0 0 14px}
p{color:var(--muted);font-size:1rem;margin:0 0 30px;line-height:1.65}
.q{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  font-family:var(--mono);font-size:.78rem;color:var(--muted);
  padding:16px 18px;margin:0 0 30px;text-align:left;overflow-x:auto;line-height:1.9;
}
.q b{color:var(--accent);font-weight:400}
.q i{color:#12855F;font-style:normal}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:12px 24px;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;font-size:.93rem;text-decoration:none;
  transition:background .2s ease, transform .2s ease;
}
.btn:hover{background:var(--accent-deep);transform:translateY(-2px)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E0B14;--surface:#17131F;--line:#2A2436;--ink:#F3F0F7;--muted:#9D95AE}
  .q i{color:#4FD1A0}
}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>No triple matches this path.</h1>
    <p>The graph was queried. The graph came back empty. It happens to the best of us.</p>

    <code class="q">
SELECT ?page WHERE {<br>
&nbsp;&nbsp;?page <b>:hasUrl</b> <i>"<span id="path">/this-one</span>"</i> .<br>
}<br>
<span style="opacity:.6">→ 0 results</span>
    </code>

    <a class="btn" href="/">
      <svg viewBox="0 0 24 24"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg>
      Back to the homepage
    </a>
  </div>

<script>
  const p = window.location.pathname;
  if (p && p !== "/") document.getElementById("path").textContent = p.slice(0, 42);
</script>
</body>
</html>
